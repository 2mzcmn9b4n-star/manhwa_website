name: Deploy Website Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Build, run, and preview website
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production environment file
        run: |
          cat > .env <<EOF
          STAGE=production
          SECRET_KEY=github-actions-preview-key-$(date +%s)
          DEBUG=False

          DB_ENGINE=postgresql
          DB_NAME=manhwa_db
          DB_USER=postgres
          DB_PASSWORD=preview-db-password
          DB_HOST=db
          DB_PORT=5432

          REDIS_URL=redis://redis:6379/0
          EOF

      - name: Build and start Docker services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose up -d --build

      - name: Show running services
        run: docker compose ps

      - name: Wait for database to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U postgres -d manhwa_db > /dev/null 2>&1; then
              echo "✓ Database is ready."
              exit 0
            fi
            echo "Attempt $attempt/30: Waiting 5 seconds..."
            sleep 5
          done
          echo "✗ Database did not start."
          docker compose logs db
          exit 1

      - name: Run Django migrations
        run: |
          echo "Running database migrations..."
          docker compose exec -T web python manage.py migrate --no-input
          echo "✓ Migrations completed"

      - name: Create demo superuser
        run: |
          echo "Creating demo superuser..."
          docker compose exec -T web python manage.py shell <<'PYTHON'
          from django.contrib.auth import get_user_model
          
          User = get_user_model()
          phone = "09123456789"
          password = "demo123456"
          
          user = User.objects.filter(phone_number=phone).first()
          
          if user is None:
              user = User.objects.create_superuser(
                  phone_number=phone,
                  password=password,
              )
              print("✓ Admin superuser created")
          else:
              user.is_staff = True
              user.is_superuser = True
              user.set_password(password)
              user.save()
              print("✓ Admin superuser already existed and was updated")
          
          print(f"\nAdmin credentials:")
          print(f"  Phone: {phone}")
          print(f"  Password: {password}")
          PYTHON

      - name: Collect static files
        run: |
          echo "Collecting static files..."
          docker compose exec -T web python manage.py collectstatic --noinput
          echo "✓ Static files collected"

      - name: Wait for website to be ready
        run: |
          echo "Waiting for website to respond..."
          for attempt in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "000")
            
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "404" ]; then
              echo "✓ Website is responding (HTTP $STATUS)"
              exit 0
            fi
            
            echo "Attempt $attempt/30: Got HTTP $STATUS. Waiting 10 seconds..."
            sleep 10
          done

          echo "✗ Website did not respond. Checking logs..."
          docker compose logs --tail=50 web
          exit 1

      - name: Check backend health endpoint
        run: |
          echo "Checking backend API..."
          curl -v http://localhost/api/healthy/ 2>&1 | head -20 || echo "Health check endpoint unavailable (this is okay)"

      - name: Install Cloudflare Tunnel
        run: |
          echo "Installing Cloudflare Tunnel..."
          curl -L \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          
          sudo dpkg -i cloudflared.deb
          echo "✓ Cloudflare Tunnel installed"

      - name: Start Cloudflare Tunnel and generate preview URL
        run: |
          echo "Starting Cloudflare Tunnel..."
          nohup cloudflared tunnel \
            --url http://localhost:80 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid
          
          echo "Waiting for preview URL to be generated..."
          for attempt in {1..30}; do
            PREVIEW_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflared.log 2>/dev/null | head -n 1 || true)

            if [ -n "$PREVIEW_URL" ]; then
              echo "✓ Preview URL generated: $PREVIEW_URL"
              echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

              {
                echo "## 🎉 Manhwa Website - Preview Live!"
                echo ""
                echo "### 🌐 Website URL"
                echo "### [$PREVIEW_URL]($PREVIEW_URL)"
                echo ""
                echo "### 🔑 Admin Panel Access"
                echo "### Admin: [$PREVIEW_URL/admin]($PREVIEW_URL/admin)"
                echo ""
                echo "**Demo Admin Credentials:**"
                echo ""
                echo "\`\`\`"
                echo "Phone: 09123456789"
                echo "Password: demo123456"
                echo "\`\`\`"
                echo ""
                echo "---"
                echo ""
                echo "### ℹ️ About This Preview"
                echo "- This is a **temporary deployment** using GitHub Actions"
                echo "- The URL is active **while this workflow is running**"
                echo "- Each service is containerized with Docker:"
                echo "  - **Backend**: Django REST Framework (port 8000)"
                echo "  - **Frontend**: Next.js (port 3000)"
                echo "  - **Database**: PostgreSQL 14 (with migrations applied)"
                echo "  - **Cache**: Redis 7"
                echo "  - **Web Server**: Nginx (reverse proxy)"
                echo "- The preview will stop if you **cancel this workflow**"
                echo ""
                echo "### 🚀 To Deploy Permanently"
                echo "Use a cloud provider like Railway, Render, Fly.io, or your own VPS with the Docker Compose setup."
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi

            echo "Attempt $attempt/30: Waiting for URL... (3 seconds)"
            sleep 3
          done

          echo "✗ Could not generate preview URL"
          cat cloudflared.log
          exit 1

      - name: Keep preview online while workflow runs
        run: |
          PREVIEW_URL="${{ env.PREVIEW_URL }}"
          echo "✓ Preview is live: $PREVIEW_URL"
          echo ""
          echo "Keeping website online..."
          
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "000")
            
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "301" ] && [ "$STATUS" != "404" ]; then
              echo "✗ Website stopped responding (HTTP $STATUS)"
              echo "Checking logs..."
              docker compose logs --tail=100 web
              exit 1
            fi

            echo "$(date '+%Y-%m-%d %H:%M:%S') - Website is running (HTTP $STATUS)"
            sleep 60
          done

      - name: Cleanup on job completion
        if: always()
        run: |
          echo "Stopping Docker services..."
          docker compose logs --tail=50 web || true
          docker compose down -v || true
          echo "✓ Cleanup completed"
